<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Admin - DUE FRATELLI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; direction: ltr; }
        .admin-container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; }
        h2 { color: #d4af37; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2a2a2a; color: #d4af37; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .filter-group { margin-bottom: 20px; }
        input[type="date"] { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Pannello Gestione Prenotazioni</h2>
    
    <div class="filter-group">
        <label for="filterDate">Filtra per data: </label>
        <input type="date" id="filterDate">
    </div>

    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Ora</th>
                <th>Cliente</th>
                <th>Telefono</th>
                <th>Servizio</th>
                <th>Azione</th>
            </tr>
        </thead>
        <tbody id="bookingsTable">
            <tr><td colspan="6">Caricamento prenotazioni...</td></tr>
        </tbody>
    </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQdgwwqv4kLr4MW8NsiVKprjbp62cYRcg",
    authDomain: "due-fratelli-barbershop.firebaseapp.com",
    projectId: "due-fratelli-barbershop",
    storageBucket: "due-fratelli-barbershop.firebasestorage.app",
    messagingSenderId: "696063399347",
    appId: "1:696063399347:web:798bc2a264c3ca74a2e7c6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const bookingsTable = document.getElementById('bookingsTable');
  const filterDate = document.getElementById('filterDate');

  async function loadBookings(dateFilter = null) {
      bookingsTable.innerHTML = '<tr><td colspan="6">Caricamento...</td></tr>';
      try {
          let q;
          if (dateFilter) {
              q = query(collection(db, "bookings"), where("date", "==", dateFilter));
          } else {
              q = query(collection(db, "bookings"));
          }

          const querySnapshot = await getDocs(q);
          bookingsTable.innerHTML = '';

          if (querySnapshot.empty) {
              bookingsTable.innerHTML = '<tr><td colspan="6">Nessuna prenotazione trovata.</td></tr>';
              return;
          }

          querySnapshot.forEach((docSnapshot) => {
              const data = docSnapshot.data();
              const row = document.createElement('tr');
              row.innerHTML = `
                  <td>${data.date}</td>
                  <td><strong>${data.time}</strong></td>
                  <td>${data.name}</td>
                  <td><a href="tel:${data.phone}" style="color:#d4af37;">${data.phone}</a></td>
                  <td>${data.service}</td>
                  <td><button class="btn-delete" data-id="${docSnapshot.id}">Elimina</button></td>
              `;
              bookingsTable.appendChild(row);
          });

          document.querySelectorAll('.btn-delete').forEach(btn => {
              btn.addEventListener('click', async (e) => {
                  if (confirm("Sei sicuro di voler eliminare questa prenotazione?")) {
                      const docId = e.target.getAttribute('data-id');
                      await deleteDoc(doc(db, "bookings", docId));
                      loadBookings(filterDate.value);
                  }
              });
          });

      } catch (error) {
          console.error("Errore: ", error);
          bookingsTable.innerHTML = '<tr><td colspan="6">Errore nel caricamento dei dati.</td></tr>';
      }
  }

  filterDate.addEventListener('change', () => loadBookings(filterDate.value));
  loadBookings();
</script>
</body>
</html>
