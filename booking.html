<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione - DUE FRATELLI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; direction: ltr; }
        .booking-container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #d4af37; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .time-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .slot { padding: 10px; background: #2a2a2a; text-align: center; border-radius: 6px; cursor: pointer; border: 1px solid #444; }
        .slot.selected { background: #d4af37; color: #000; font-weight: bold; }
        .slot.booked { background: #3a1c1c; color: #777; cursor: not-allowed; text-decoration: line-through; border-color: #552222; }
        button.btn-submit { width: 100%; padding: 14px; background: #d4af37; border: none; color: #000; font-weight: bold; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        button.btn-submit:disabled { background: #555; cursor: not-allowed; }
        .message { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="booking-container">
    <h2>Prenota il tuo Appuntamento</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Nome e Cognome:</label>
            <input type="text" id="name" required placeholder="Es. Mario Rossi">
        </div>
        <div class="form-group">
            <label for="phone">Telefono:</label>
            <input type="tel" id="phone" required placeholder="Es. 3201234567">
        </div>
        <div class="form-group">
            <label for="service">Servizio:</label>
            <select id="service" required>
                <option value="Taglio Capelli">Taglio Capelli - €15</option>
                <option value="Barba">Barba - €10</option>
                <option value="Taglio + Barba">Taglio + Barba - €22</option>
            </select>
        </div>
        <div class="form-group">
            <label for="date">Data:</label>
            <input type="date" id="date" required>
        </div>
        
        <div class="form-group">
            <label>Seleziona Orario:</label>
            <div id="timeSlots" class="time-slots">
                <p style="grid-column: span 3; color: #888;">Seleziona prima una data.</p>
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>Conferma Prenotazione</button>
    </form>
    <div id="statusMessage" class="message"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQdgwwqv4kLr4MW8NsiVKprjbp62cYRcg",
    authDomain: "due-fratelli-barbershop.firebaseapp.com",
    projectId: "due-fratelli-barbershop",
    storageBucket: "due-fratelli-barbershop.firebasestorage.app",
    messagingSenderId: "696063399347",
    appId: "1:696063399347:web:798bc2a264c3ca74a2e7c6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const availableHours = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30"];
  let selectedTime = null;

  const dateInput = document.getElementById('date');
  const timeSlotsDiv = document.getElementById('timeSlots');
  const submitBtn = document.getElementById('submitBtn');
  const bookingForm = document.getElementById('bookingForm');
  const statusMessage = document.getElementById('statusMessage');

  dateInput.min = new Date().toISOString().split('T')[0];

  dateInput.addEventListener('change', async () => {
      const selectedDate = dateInput.value;
      if (!selectedDate) return;

      timeSlotsDiv.innerHTML = 'Caricamento orari...';
      selectedTime = null;
      submitBtn.disabled = true;

      const q = query(collection(db, "bookings"), where("date", "==", selectedDate));
      const querySnapshot = await getDocs(q);
      const bookedHours = querySnapshot.docs.map(doc => doc.data().time);

      timeSlotsDiv.innerHTML = '';
      availableHours.forEach(hour => {
          const slot = document.createElement('div');
          slot.classList.add('slot');
          slot.innerText = hour;

          if (bookedHours.includes(hour)) {
              slot.classList.add('booked');
              slot.title = "Non disponibile";
          } else {
              slot.addEventListener('click', () => {
                  document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                  slot.classList.add('selected');
                  selectedTime = hour;
                  submitBtn.disabled = false;
              });
          }
          timeSlotsDiv.appendChild(slot);
      });
  });

  bookingForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedTime) return;

      submitBtn.disabled = true;
      submitBtn.innerText = "Invio in corso...";

      try {
          await addDoc(collection(db, "bookings"), {
              name: document.getElementById('name').value,
              phone: document.getElementById('phone').value,
              service: document.getElementById('service').value,
              date: dateInput.value,
              time: selectedTime,
              createdAt: new Date()
          });

          statusMessage.style.color = "#4CAF50";
          statusMessage.innerText = "Prenotazione confermata con successo!";
          bookingForm.reset();
          timeSlotsDiv.innerHTML = '<p style="grid-column: span 3; color: #888;">Seleziona prima una data.</p>';
      } catch (error) {
          statusMessage.style.color = "#f44336";
          statusMessage.innerText = "Errore durante la prenotazione. Riprova.";
          console.error("Error adding document: ", error);
      } finally {
          submitBtn.innerText = "Conferma Prenotazione";
      }
  });
</script>
</body>
</html>
